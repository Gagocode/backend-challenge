services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wager}
      POSTGRES_USER: ${POSTGRES_USER:-wager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SERVICES: sqs
      DEBUG: "0"
      PERSISTENCE: "1"
      SQS_MAIN_QUEUE: ${SQS_MAIN_QUEUE:-wager-transactions.fifo}
      SQS_OUTPUT_QUEUE: ${SQS_OUTPUT_QUEUE:-wager-integration-events.fifo}
      SQS_DLQ: ${SQS_DLQ:-wager-transactions-dlq.fifo}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"running\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wager}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-wager}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_ENDPOINT: http://localstack:4566
      SQS_MAIN_QUEUE: ${SQS_MAIN_QUEUE:-wager-transactions.fifo}
      SQS_OUTPUT_QUEUE: ${SQS_OUTPUT_QUEUE:-wager-integration-events.fifo}
      SQS_DLQ: ${SQS_DLQ:-wager-transactions-dlq.fifo}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  localstack-data:
